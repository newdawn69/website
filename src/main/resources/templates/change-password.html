<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Change Password</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="container" style="max-width: 480px; margin-top: 50px; margin-bottom: 50px;">
        <h1 class="mb-4" th:text="#{changePassword.title}">Change password</h1>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/profile/change-password}" method="post">
            <div class="setting-row d-block">
                <label class="setting-label d-block mb-2" th:text="#{changePassword.current}">Current password</label>
                <div class="input-group">
                    <input type="password" id="currentPassword" name="currentPassword" class="form-control">
                    <button type="button" class="btn btn-outline-secondary toggle-password" data-target="currentPassword" th:text="#{register.show}">Show</button>
                </div>
            </div>

            <div class="setting-row d-block">
                <label class="setting-label d-block mb-2" th:text="#{changePassword.new}">New password</label>
                <div class="input-group">
                    <input type="password" id="password" name="newPassword" class="form-control">
                    <button type="button" class="btn btn-outline-secondary toggle-password" data-target="password" th:text="#{register.show}">Show</button>
                </div>
                <div id="password-strength-hint" class="setting-hint mt-1" th:text="#{register.strengthHint}"></div>
            </div>

            <div class="setting-row d-block">
                <label class="setting-label d-block mb-2" th:text="#{changePassword.confirm}">Confirm new password</label>
                <div class="input-group">
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control">
                    <button type="button" class="btn btn-outline-secondary toggle-password" data-target="confirmPassword" th:text="#{register.show}">Show</button>
                </div>
                <div id="password-match-hint" class="setting-hint mt-1"></div>
            </div>

            <button type="submit" class="btn btn-accent w-100" th:text="#{changePassword.submit}">Change password</button>
        </form>

        <p class="mt-3"><a th:href="@{/profile}" th:text="#{editProfile.cancel}">Cancel</a></p>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
