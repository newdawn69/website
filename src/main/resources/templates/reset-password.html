<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Reset Password</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="container" style="max-width: 420px; margin-top: 50px; margin-bottom: 50px;">
        <h1 class="mb-3" th:text="#{reset.title}">Reset password</h1>

        <div th:if="${expired}">
            <div class="alert alert-danger" th:text="#{reset.expired}"></div>
            <a th:href="@{/forgot-password}" class="btn btn-dark" th:text="#{reset.requestNew}">Request a new link</a>
        </div>

        <form th:unless="${expired}" th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">

            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <div class="mb-3">
                <label class="form-label" th:text="#{reset.newPassword}">New password</label>
                <div class="input-group">
                    <input type="password" id="password" name="password" class="form-control">
                    <button type="button" class="btn btn-outline-secondary toggle-password" data-target="password" th:text="#{register.show}">Show</button>
                </div>
                <div id="password-strength-hint" class="form-text text-muted" th:text="#{register.strengthHint}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label" th:text="#{reset.confirmNewPassword}">Confirm new password</label>
                <div class="input-group">
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control">
                    <button type="button" class="btn btn-outline-secondary toggle-password" data-target="confirmPassword" th:text="#{register.show}">Show</button>
                </div>
                <div id="password-match-hint" class="form-text"></div>
            </div>

            <button type="submit" class="btn btn-dark w-100" th:text="#{reset.submit}">Reset password</button>
        </form>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
