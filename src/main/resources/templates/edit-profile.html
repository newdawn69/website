<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Edit Profile</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container" style="max-width: 480px; margin-top: 50px; margin-bottom: 50px;">
        <h1 class="mb-4">Edit profile</h1>

        <form th:action="@{/profile/edit}" th:object="${form}" method="post">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" th:field="*{username}">
                <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" th:field="*{email}">
                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Backup email <span class="text-muted">(optional)</span></label>
                <input type="email" class="form-control" th:field="*{backupEmail}">
            </div>

            <div class="mb-4">
                <label class="form-label">Phone number <span class="text-muted">(optional)</span></label>
                <input type="tel" class="form-control" th:field="*{phoneNumber}">
            </div>

            <div class="alert alert-warning small">Changing your username will log you out — you'll need to log back in with the new one.</div>

            <button type="submit" class="btn btn-dark w-100">Save changes</button>
        </form>

        <p class="mt-3"><a th:href="@{/profile}">Cancel</a></p>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
