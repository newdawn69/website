<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Edit Profile</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="container" style="max-width: 600px; margin-top: 50px; margin-bottom: 50px;">
        <h1 class="mb-4" th:text="#{editProfile.title}">Edit profile</h1>

        <form th:action="@{/profile/edit}" th:object="${form}" method="post">

            <div class="setting-row d-block">
                <label class="setting-label d-block mb-2" th:text="#{editProfile.username}">Username</label>
                <input type="text" class="form-control" th:field="*{username}">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="setting-row d-block">
                <label class="setting-label d-block mb-2" th:text="#{editProfile.email}">Email</label>
                <input type="email" class="form-control" th:field="*{email}">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="setting-row d-block">
                <label class="setting-label d-block mb-2"><span th:text="#{editProfile.backupEmail}">Backup email</span> <span class="setting-hint" th:text="#{register.optional}">(optional)</span></label>
                <input type="email" class="form-control" th:field="*{backupEmail}">
            </div>

            <div class="setting-row d-block">
                <label class="setting-label d-block mb-2"><span th:text="#{editProfile.phone}">Phone number</span> <span class="setting-hint" th:text="#{register.optional}">(optional)</span></label>
                <input type="tel" class="form-control" th:field="*{phoneNumber}">
            </div>

            <div class="setting-row d-block">
                <label class="setting-label d-block mb-2"><span th:text="#{editProfile.gender}">Gender</span> <span class="setting-hint" th:text="#{register.optional}">(optional)</span></label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" th:field="*{gender}" value="MALE" id="genderMale">
                    <label class="form-check-label" for="genderMale" th:text="#{editProfile.male}">Male</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" th:field="*{gender}" value="FEMALE" id="genderFemale">
                    <label class="form-check-label" for="genderFemale" th:text="#{editProfile.female}">Female</label>
                </div>
            </div>

            <div class="alert alert-warning small" th:text="#{editProfile.warning}"></div>

            <button type="submit" class="btn btn-accent w-100" th:text="#{editProfile.save}">Save changes</button>
        </form>

        <p class="mt-3"><a th:href="@{/profile}" th:text="#{editProfile.cancel}">Cancel</a></p>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
