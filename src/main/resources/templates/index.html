<!DOCTYPE html>

<head th:replace="~{fragments/layout :: head}">
    <title>Project 28</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="container" style="max-width: 700px; margin-top: 50px; margin-bottom: 50px;">
        <div class="alert alert-success" th:if="${param.accountDeleted}" th:text="#{home.accountDeleted}"></div>

        <h1 th:text="${appName}">App Name</h1>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
