<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Verify Login</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container" style="max-width: 420px; margin-top: 50px; margin-bottom: 50px;">
        <h1 class="mb-3">Verify your login</h1>
        <p class="text-muted">We emailed a 6-digit code to your account's email address. Enter it below to finish logging in.</p>

        <div class="alert alert-success" th:if="${resent}">A new code has been sent.</div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/verify-2fa}" method="post">
            <div class="mb-3">
                <label class="form-label">Verification code</label>
                <input type="text" name="code" class="form-control" maxlength="6" inputmode="numeric" autocomplete="one-time-code" autofocus>
            </div>
            <button type="submit" class="btn btn-dark w-100">Verify</button>
        </form>

        <form th:action="@{/resend-2fa-code}" method="post" class="mt-3">
            <button type="submit" class="btn btn-link p-0">Resend code</button>
        </form>

        <p class="mt-3"><a th:href="@{/login}">Cancel and log in again</a></p>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
