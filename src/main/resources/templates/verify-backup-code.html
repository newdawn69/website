<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Verify Login</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="container" style="max-width: 420px; margin-top: 50px; margin-bottom: 50px;">
        <h1 class="mb-3" th:text="#{verifyBackup.title}">Verify your login</h1>
        <p class="text-muted" th:text="#{verifyBackup.description}">Enter one of your saved backup codes.</p>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/verify-backup-code}" method="post">
            <div class="mb-3">
                <label class="form-label" th:text="#{verifyBackup.code}">Backup code</label>
                <input type="text" name="code" class="form-control" autocomplete="off" autofocus>
            </div>
            <button type="submit" class="btn btn-accent w-100" th:text="#{verify.submit}">Verify</button>
        </form>

        <p class="mt-3"><a th:href="@{/login}" th:text="#{verify.cancel}">Cancel and log in again</a></p>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
