<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="head">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <script>
            (function () {
                const saved = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-bs-theme', saved);
            })();
        </script>
    </th:block>
</head>
<body>

<div th:fragment="navbar">
    <nav class="navbar navbar-expand navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" th:href="@{/}">Project 28</a>

        <button type="button"
                class="btn btn-sm rounded-circle p-0 ms-auto border-0"
                style="width: 40px; height: 40px; overflow: hidden;"
                data-bs-toggle="offcanvas" data-bs-target="#appSidebar" aria-controls="appSidebar">
            <img th:if="${currentUser != null and currentUser.avatarFilename != null}"
                 th:src="@{'/uploads/avatars/' + ${currentUser.avatarFilename}}"
                 alt="Profile"
                 style="width: 100%; height: 100%; object-fit: cover;">
            <span th:unless="${currentUser != null and currentUser.avatarFilename != null}"
                  class="d-flex align-items-center justify-content-center bg-secondary text-white rounded-circle"
                  style="width: 100%; height: 100%; font-size: 18px;">👤</span>
        </button>
    </nav>
</div>

<div th:fragment="sidebar">
    <div class="offcanvas offcanvas-end" tabindex="-1" id="appSidebar" aria-labelledby="appSidebarLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="appSidebarLabel" th:text="#{sidebar.title}">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">

            <h6 class="text-uppercase text-muted small mb-2" th:text="#{sidebar.userManagement}">User Management</h6>
            <div class="list-group list-group-flush mb-4">
                <span sec:authorize="isAuthenticated()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
                    <a class="list-group-item list-group-item-action" th:href="@{/profile}" th:text="#{nav.profile}">Profile</a>
                    <a class="list-group-item list-group-item-action" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" th:text="#{nav.admin}">Admin</a>
                    <a class="list-group-item list-group-item-action" th:href="@{/logout}" th:text="#{nav.logout}">Logout</a>
                </span>
                <span sec:authorize="isAnonymous()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
                    <a class="list-group-item list-group-item-action" th:href="@{/login}" th:text="#{nav.login}">Login</a>
                    <a class="list-group-item list-group-item-action" th:href="@{/register}" th:text="#{nav.register}">Register</a>
                </span>
                <a class="list-group-item list-group-item-action" th:href="@{/}" th:text="#{nav.home}">Home</a>
            </div>

            <h6 class="text-uppercase text-muted small mb-2" th:text="#{sidebar.appSettings}">App Settings</h6>

            <div class="mb-3">
                <label class="form-label small d-block" th:text="#{sidebar.theme}">Theme</label>
                <button id="theme-toggle" type="button" class="btn btn-sm btn-outline-secondary">🌙 Dark mode</button>
            </div>

            <div class="mb-3">
                <label class="form-label small d-block" th:text="#{sidebar.language}">Language</label>
                <div class="btn-group btn-group-sm" role="group">
                    <button type="button" class="btn btn-outline-secondary" onclick="window.location.href = window.location.pathname + '?lang=en'">EN</button>
                    <button type="button" class="btn btn-outline-secondary" onclick="window.location.href = window.location.pathname + '?lang=si'">සිං</button>
                </div>
            </div>

        </div>
    </div>
</div>

<div th:fragment="footer">
    <footer class="text-center text-muted small py-4 mt-5 border-top">
        <p th:text="#{footer.text}">Project 28 — coursework project</p>
    </footer>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/auth.js}"></script>
</th:block>

</body>
</html>
