<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Shared head content: Bootstrap + our own CSS -->
    <th:block th:fragment="head">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </th:block>
</head>
<body>

<!-- Navbar fragment -->
<div th:fragment="navbar">
    <nav class="navbar navbar-expand navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" th:href="@{/}">Social Web Foundation</a>
        <div class="ms-auto d-flex gap-3">
            <a class="nav-link text-light" th:href="@{/}">Home</a>
            <span sec:authorize="isAuthenticated()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" class="d-flex gap-3">
                <a class="nav-link text-light" th:href="@{/profile}">Profile</a>
                <a class="nav-link text-light" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin</a>
                <a class="nav-link text-light" th:href="@{/logout}">Logout</a>
            </span>
            <span sec:authorize="isAnonymous()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" class="d-flex gap-3">
                <a class="nav-link text-light" th:href="@{/login}">Login</a>
                <a class="nav-link text-light" th:href="@{/register}">Register</a>
            </span>
        </div>
    </nav>
</div>

<!-- Footer fragment -->
<div th:fragment="footer">
    <footer class="text-center text-muted small py-4 mt-5 border-top">
        <p>Social Web Foundation &mdash; coursework project</p>
    </footer>
</div>

<!-- Shared JS -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/auth.js}"></script>
</th:block>

</body>
</html>
