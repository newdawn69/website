<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>App Settings</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="container" style="max-width: 760px; margin-top: 50px; margin-bottom: 50px;">
        <h1 class="mb-4" th:text="#{settings.title}">App Settings</h1>

        <div class="setting-row">
            <div>
                <div class="setting-label" th:text="#{settings.theme}">Theme</div>
                <div class="setting-hint" th:text="#{settings.themeHint}">Choose how it looks</div>
            </div>
            <button id="theme-toggle" type="button" class="btn btn-accent">🌙 Dark mode</button>
        </div>

        <div class="setting-row">
            <div>
                <div class="setting-label" th:text="#{settings.language}">Language</div>
                <div class="setting-hint" th:text="#{settings.languageHint}">Choose your language</div>
            </div>
            <div class="btn-group" role="group">
                <button type="button" class="btn" th:classappend="${#locale.language == 'en'} ? 'btn-accent' : 'btn-outline-secondary'" onclick="window.location.href = window.location.pathname + '?lang=en'">English</button>
                <button type="button" class="btn" th:classappend="${#locale.language == 'si'} ? 'btn-accent' : 'btn-outline-secondary'" onclick="window.location.href = window.location.pathname + '?lang=si'">සිංහල</button>
            </div>
        </div>

        <!-- Single unified Two-Factor Authentication card -->
        <div sec:authorize="isAuthenticated()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
             class="setting-row d-block">

            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="setting-label" th:text="#{settings.twoFa}">Two-factor authentication</div>
                <div class="form-check form-switch mb-0">
                    <input class="form-check-input" type="checkbox" role="switch" id="twoFaSwitch" form="twoFaForm" name="twoFaEnabled" th:checked="${currentUser != null and currentUser.twoFaEnabled}">
                </div>
            </div>
            <div class="setting-hint mb-3" th:text="#{settings.twoFaHint}">Extra verification step at login</div>

            <div class="alert alert-success" th:if="${twoFaUpdated}" th:text="#{settings.twoFaUpdated}">Updated.</div>

            <form id="twoFaForm" th:action="@{/settings/2fa}" method="post">

                <div class="mb-3">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="twoFaMethod" value="EMAIL" id="methodEmail"
                               th:checked="${currentUser == null or currentUser.twoFaMethod == null or currentUser.twoFaMethod == 'EMAIL'}">
                        <label class="form-check-label" for="methodEmail" th:text="#{settings.methodEmail}">Email code</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="twoFaMethod" value="BACKUP_CODES" id="methodBackup"
                               th:checked="${currentUser != null and currentUser.twoFaMethod == 'BACKUP_CODES'}">
                        <label class="form-check-label" for="methodBackup" th:text="#{settings.methodBackup}">Backup codes</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small" th:text="#{settings.twoFaEmail}">2FA code email</label>
                    <input type="email" name="twoFaEmail" class="form-control"
                           th:value="${currentUser != null ? currentUser.twoFaEmail : ''}"
                           th:placeholder="${currentUser != null ? currentUser.email : ''}">
                    <div class="form-text" th:text="#{settings.twoFaEmailHint}">Leave blank to use your main account email.</div>
                </div>

                <button type="submit" class="btn btn-accent" th:text="#{settings.save}">Save</button>
            </form>

            <hr class="my-3">

            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <div class="setting-label" th:text="#{settings.backupCodes}">Backup codes</div>
                    <div class="setting-hint" th:text="#{settings.backupCodesHint}">Generate one-time login codes</div>
                </div>
                <form th:action="@{/settings/2fa/backup-codes}" method="post" onsubmit="return confirm('This replaces any existing backup codes. Continue?');">
                    <button type="submit" class="btn btn-accent" th:text="#{settings.generate}">Generate</button>
                </form>
            </div>

            <div th:if="${newBackupCodes}" class="alert alert-warning mt-3 mb-0">
                <p class="fw-bold" th:text="#{settings.backupCodesGenerated}">Save these codes now - you won't see them again:</p>
                <div class="row row-cols-2 g-1 font-monospace">
                    <div th:each="c : ${newBackupCodes}" th:text="${c}"></div>
                </div>
            </div>

        </div>

        <p class="mt-4"><a th:href="@{/}" th:text="#{settings.backHome}">Back to home</a></p>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
