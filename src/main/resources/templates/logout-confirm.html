<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Confirm Logout</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="container" style="max-width: 420px; margin-top: 50px; margin-bottom: 50px;">
        <h1 class="mb-3" th:text="#{logoutConfirm.title}">Confirm logout</h1>
        <p class="text-muted" th:text="#{logoutConfirm.description}">Enter your password to log out.</p>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/logout-confirm}" method="post">
            <div class="setting-row d-block">
                <label class="setting-label d-block mb-2" th:text="#{logoutConfirm.password}">Password</label>
                <div class="input-group">
                    <input type="password" id="password" name="password" class="form-control">
                    <button type="button" class="btn btn-outline-secondary toggle-password" data-target="password" th:text="#{register.show}">Show</button>
                </div>
            </div>

            <button type="submit" class="btn btn-accent w-100" th:text="#{logoutConfirm.submit}">Logout</button>
        </form>

        <p class="mt-3"><a th:href="@{/profile}" th:text="#{logoutConfirm.cancel}">Cancel</a></p>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
