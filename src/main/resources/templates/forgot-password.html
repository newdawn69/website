<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Forgot Password</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container" style="max-width: 420px; margin-top: 50px; margin-bottom: 50px;">
        <h1 class="mb-3">Forgot password</h1>
        <p class="text-muted">Enter your account email and we'll generate a reset link.</p>

        <div class="alert alert-info" th:if="${message}">
            <p th:text="${message}" class="mb-0"></p>
        </div>

        <form th:action="@{/forgot-password}" method="post" class="mt-3">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-dark w-100">Generate reset link</button>
        </form>

        <p class="mt-3"><a th:href="@{/login}">Back to login</a></p>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
