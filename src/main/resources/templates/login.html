<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Login</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container" style="max-width: 420px; margin-top: 50px; margin-bottom: 50px;">
        <h1 class="mb-4">Log in</h1>

        <div class="alert alert-success" th:if="${param.registered}">Account created — you can log in now.</div>
        <div class="alert alert-success" th:if="${param.resetSuccess}">Password reset — you can log in with your new password.</div>
        <div class="alert alert-success" th:if="${param.profileUpdated}">Profile updated — please log in again.</div>
        <div class="alert alert-danger" th:if="${param.error}">Invalid username or password.</div>
        <div class="alert alert-success" th:if="${param.logout}">You've been logged out.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" id="loginPassword" name="password" class="form-control">
                    <button type="button" class="btn btn-outline-secondary toggle-password" data-target="loginPassword">Show</button>
                </div>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" name="remember-me" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Remember me for 14 days</label>
            </div>

            <button type="submit" class="btn btn-dark w-100">Log in</button>
        </form>

        <p class="mt-3">
            <a th:href="@{/forgot-password}">Forgot password?</a>
        </p>
        <p>No account yet? <a th:href="@{/register}">Register</a></p>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
