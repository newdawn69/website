<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Login</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="container" style="max-width: 420px; margin-top: 50px; margin-bottom: 50px;">
        <h1 class="mb-4" th:text="#{login.title}">Log in</h1>

        <div class="alert alert-success" th:if="${param.registered}" th:text="#{login.registered}"></div>
        <div class="alert alert-success" th:if="${param.resetSuccess}" th:text="#{login.resetSuccess}"></div>
        <div class="alert alert-success" th:if="${param.profileUpdated}" th:text="#{login.profileUpdated}"></div>
        <div class="alert alert-danger" th:if="${param.error}" th:text="#{login.error}"></div>
        <div class="alert alert-success" th:if="${param.logout}" th:text="#{login.loggedOut}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" th:text="#{login.username}">Username</label>
                <input type="text" name="username" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label" th:text="#{login.password}">Password</label>
                <div class="input-group">
                    <input type="password" id="loginPassword" name="password" class="form-control">
                    <button type="button" class="btn btn-outline-secondary toggle-password" data-target="loginPassword" th:text="#{register.show}">Show</button>
                </div>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" name="remember-me" id="rememberMe">
                <label class="form-check-label" for="rememberMe" th:text="#{login.rememberMe}">Remember me for 14 days</label>
            </div>

            <button type="submit" class="btn btn-dark w-100" th:text="#{login.submit}">Log in</button>
        </form>

        <p class="mt-3">
            <a th:href="@{/forgot-password}" th:text="#{login.forgot}">Forgot password?</a>
        </p>
        <p><span th:text="#{login.noAccount}">No account yet?</span> <a th:href="@{/register}" th:text="#{login.register}">Register</a></p>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
